<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting Etsy…</title>
<style>
  :root { --bg: #07080f; --card: #10132a; --text: #e8eaf6; --muted: #9aa0c3; --accent: #38bdf8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; padding: 16px; }
  .card { background: var(--card); border: 1px solid #262b52; border-radius: 16px; padding: 24px; max-width: 520px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 8px 0; }
  textarea { width: 100%; height: 96px; background: #07080f; color: var(--text); border: 1px solid #262b52;
             border-radius: 10px; padding: 10px; font: 12px/1.4 ui-monospace, monospace; resize: none; }
  button { margin-top: 10px; background: var(--accent); color: #04121c; border: 0; border-radius: 10px;
           padding: 10px 16px; font-weight: 700; cursor: pointer; }
  #fallback { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Handing you back to Ultron…</h1>
  <p id="lead">Etsy approved the connection. Forwarding the one-time code to Ultron on this computer.</p>
  <div id="fallback">
    <p>If Ultron didn't open, copy this whole link and paste it into Ultron → Command Deck → <b>Connect Etsy</b> → "Paste link".</p>
    <textarea id="url" readonly></textarea>
    <button id="copy" type="button">Copy link</button>
  </div>
</div>
<script>
  // Etsy only allows HTTPS redirect URLs, so it lands here first. This page
  // forwards the code + state to the Ultron API running on this computer.
  // The code is single-use and useless without the PKCE verifier Ultron holds.
  var here = window.location.href;
  document.getElementById('url').value = here;
  document.getElementById('copy').onclick = function () {
    navigator.clipboard && navigator.clipboard.writeText(here);
    this.textContent = 'Copied';
  };
  if (window.location.search.indexOf('code=') !== -1 || window.location.search.indexOf('error=') !== -1) {
    setTimeout(function () { document.getElementById('fallback').style.display = 'block'; }, 2500);
    window.location.href = 'http://127.0.0.1:1888/api/etsy/callback' + window.location.search;
  } else {
    document.getElementById('title').textContent = 'Ultron ↔ Etsy relay';
    document.getElementById('lead').textContent = 'This page is the OAuth callback for a private Etsy app. Nothing to see here.';
  }
</script>
</body>
</html>
